name: Release Mine

on:
  schedule:
    # Offset from the top of the hour (and after Sync Upstream at 22:17) to reduce scheduler delays.
    # GITHUB_TOKEN pushes from sync do not trigger push workflows, so the schedule is the main path.
    - cron: "47 22 * * *"
  push:
    branches:
      - main-mine
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-mine
  cancel-in-progress: false

jobs:
  release:
    name: Build Windows service from main-mine
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main-mine
          fetch-depth: 0

      - name: Resolve fork version
        id: target
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          base="$(awk -F '"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ ! "$base" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Cargo.toml version: $base" >&2
            exit 1
          fi
          major="${base%%.*}"
          rest="${base#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          fork_base="${major}.${minor}.$((patch + 1))"
          head_sha="$(git rev-parse HEAD)"
          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName --jq '.[].tagName' || true)"
          n=1
          for t in $existing; do
            if [[ "$t" =~ ^v${fork_base}-mine\.([0-9]+)$ ]]; then
              idx="${BASH_REMATCH[1]}"
              # Skip when this commit already has a release tag.
              obj="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$t" 2>/dev/null || true)"
              obj_type="$(printf '%s' "$obj" | jq -r '.object.type // empty' 2>/dev/null || true)"
              sha="$(printf '%s' "$obj" | jq -r '.object.sha // empty' 2>/dev/null || true)"
              if [ "$obj_type" = "tag" ] && [ -n "$sha" ]; then
                sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq '.object.sha' 2>/dev/null || true)"
              fi
              if [ "$sha" = "$head_sha" ]; then
                echo "Commit $head_sha already released as $t; skipping."
                echo "skip=true" >> "$GITHUB_OUTPUT"
                exit 0
              fi
              if [ "$idx" -ge "$n" ]; then
                n=$((idx + 1))
              fi
            fi
          done
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "version=${fork_base}-mine.${n}" >> "$GITHUB_OUTPUT"
          echo "release_tag=v${fork_base}-mine.${n}" >> "$GITHUB_OUTPUT"
          echo "Target: upstream service $base -> v${fork_base}-mine.${n} from $head_sha"

      - name: Install Rust toolchain
        if: steps.target.outputs.skip != 'true'
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"

      - name: Build patched service
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: cargo build --release --features "standalone client"

      - name: Package Windows bundle
        if: steps.target.outputs.skip != 'true'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
        run: |
          $asset = "clash-verge-service-ipc-$env:RELEASE_TAG-x86_64-pc-windows-msvc"
          New-Item -ItemType Directory -Path package -Force | Out-Null
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          Copy-Item "target/release/clash-verge-service.exe" package/
          Copy-Item "target/release/clash-verge-service-install.exe" package/
          Copy-Item "target/release/clash-verge-service-uninstall.exe" package/
          Copy-Item LICENSE package/
          Compress-Archive -Path package/* -DestinationPath "dist/$asset.zip" -Force

      - name: Generate SHA256SUMS
        if: steps.target.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create prerelease
        if: steps.target.outputs.skip != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.target.outputs.release_tag }}
          VERSION: ${{ steps.target.outputs.version }}
          BASE: ${{ steps.target.outputs.base }}
        run: |
          set -euo pipefail
          asset="$(basename "$(ls dist/*.zip | head -1)")"
          zip_sha="$(awk 'NR==1 {print $1}' dist/SHA256SUMS.txt)"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Patched Windows x64 build of the fork's \`main-mine\` branch.

          - **Base:** upstream clash-verge-service-ipc $BASE
          - **Patch:** in service mode, a failed remote proxy-provider refresh keeps the last successfully downloaded cache instead of deleting it first and leaving zero nodes
          - **Commit:** \`$GITHUB_SHA\`
          - **Version rule:** upstream patch+1 + \`-mine.N\` (upstream $BASE -> $VERSION)

          **Assets**

          - \`$asset\` - clash-verge-service.exe, clash-verge-service-install.exe, clash-verge-service-uninstall.exe, LICENSE
          - \`SHA256SUMS.txt\`

          ZIP SHA256: \`$zip_sha\`

          The app fork's Windows release workflow consumes this build when the release tag's commit equals \`main-mine\` HEAD; otherwise it falls back to building the service from source.
          EOF
          prev_tag="$(git describe --tags --abbrev=0 --match 'v[0-9]*-mine.*' HEAD 2>/dev/null || true)"
          commit_dir="$RUNNER_TEMP/fork-commits"
          mkdir -p "$commit_dir"
          if [ -n "$prev_tag" ]; then
            git log --no-merges --pretty=tformat:'%h%x09%s' "$prev_tag..HEAD" | while IFS=$'\t' read -r csha csubject; do
              [ -z "$csha" ] && continue
              case "$csubject" in
                "ci: sync"*) continue ;;
                fix*) type=fix ;;
                feat*) type=feat ;;
                ci*) type=ci ;;
                docs*) type=docs ;;
                chore*) type=chore ;;
                refactor*) type=refactor ;;
                perf*) type=perf ;;
                test*) type=test ;;
                build*) type=build ;;
                *) type=other ;;
              esac
              printf -- '- `%s` %s\n' "$csha" "$csubject" >> "$commit_dir/$type"
            done
            if ls "$commit_dir"/* >/dev/null 2>&1; then
              {
                echo ""
                echo "**Fork commits since $prev_tag**"
                echo ""
                for pair in "feat:Features" "fix:Fixes" "refactor:Refactors" "perf:Performance" "build:Build" "ci:CI" "docs:Docs" "test:Tests" "chore:Chores" "other:Other"; do
                  f="$commit_dir/${pair%%:*}"
                  if [ -s "$f" ]; then
                    echo "**${pair#*:}**"
                    echo ""
                    cat "$f"
                    echo ""
                  fi
                done
              } >> "$RUNNER_TEMP/notes.md"
            fi
          fi
          upstream_notes="$(gh api "repos/clash-verge-rev/clash-verge-service-ipc/releases/tags/v$BASE" --jq '.body // empty' 2>/dev/null || true)"
          {
            echo ""
            echo "**Upstream release notes (v$BASE)**"
            echo ""
            if [ -n "$upstream_notes" ]; then
              echo "<details><summary>Expand</summary>"
              echo ""
              printf '%s\n' "$upstream_notes"
              echo ""
              echo "</details>"
            else
              echo "_Not available (upstream v$BASE has no published release yet)._"
            fi
          } >> "$RUNNER_TEMP/notes.md"
          gh release create "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "clash-verge-service-ipc $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
