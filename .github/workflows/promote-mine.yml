name: Promote Mine

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Fork release tag to promote (e.g. v2.7.8-mine.6)"
        required: true

permissions:
  contents: write

jobs:
  promote:
    name: Promote prerelease to formal
    runs-on: ubuntu-latest
    steps:
      - name: Promote release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mine\.[0-9]+$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null || {
            echo "Release $TAG not found" >&2
            exit 1
          }
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest
          echo "Promoted $TAG to a formal release." >> "$GITHUB_STEP_SUMMARY"
